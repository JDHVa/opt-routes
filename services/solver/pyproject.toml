[project]
name = "routeopt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "ortools>=9.15.6755",
    "pydantic>=2",
    "pymoo>=0.6.2",
    "pyvrp>=0.14.1",
    "scikit-learn>=1.9.1",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
    "vrplib>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
