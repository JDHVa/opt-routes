services:
  solver:
    build: ./services/solver
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      SOLVER_URL: http://solver:8000
    depends_on:
      - solver

  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/nuevo-leon.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./infra/osrm/data:/data
